name: Flutter Build and Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Extract Version from pubspec.yaml inside wdms-mobile/
      - name: Get version from pubspec
        id: pubspec_version
        working-directory: ./wdms-mobile
        run: |
          # Added ^ to only match the actual version key, and tr -d '\r' to prevent hidden line-ending bugs in tag names
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./wdms-mobile
        run: flutter pub get

      - name: Build APK
        working-directory: ./wdms-mobile
        run: flutter build apk --release

      # 2. Create Release using the extracted version
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.pubspec_version.outputs.tag_name }}
          name: Release ${{ steps.pubspec_version.outputs.display_version }}
          # Updated file path to include wdms-mobile/ at the beginning
          files: wdms-mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}